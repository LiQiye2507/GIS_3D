# Cấu hình nginx cho frontend (docker-compose.yml gắn vào /etc/nginx/conf.d/default.conf).
# Giống mặc định của image nginx, thêm "Cache-Control: no-cache": trình duyệt luôn hỏi lại máy chủ (ETag) trước khi
# dùng bản đã lưu, nên sửa JS/CSS/dữ liệu xong chỉ cần tải lại trang. Không có header này, trình duyệt có thể tự giữ
# file cũ (vd. frame.js) và hiển thị lỗi đã sửa rồi.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
